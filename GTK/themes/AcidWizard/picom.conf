# ===============================
# Picom config / XFCE4
# ===============================

# ===============================
# Backend
# ===============================
backend = "glx"
vsync = true

# ===============================
# Shadows
# ===============================
shadow = true
shadow-radius = 1 
shadow-opacity = 1.0
shadow-offset-x = 12
shadow-offset-y = 12
shadow-color = "#262C28"

# Exclude panels/docks from shadow
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "maximized = 1"
];

# ===============================
# Shadow stability fixes
# ===============================
use-damage = true
shadow-ignore-shaped = false
mark-wmwin-focused = true
mark-ovredir-focused = false


# ===============================
# Fading
# ===============================
fading = true

# ===============================
# Transparency / opacity
# ===============================
frame-opacity = 1.0

# ===============================
# Rounded corners (optional)
# ===============================
#corner-radius = 0

# ===============================
# General
# ===============================
detect-rounded-corners = true
detect-client-opacity = true
use-damage = true

# Blur (disabled, not needed)
blur-background = false
