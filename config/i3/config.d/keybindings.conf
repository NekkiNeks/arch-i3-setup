# Caps to escape and layout change on win + space
exec_always --no-startup-id setxkbmap -layout us,ru -option 'grp:win_space_toggle,caps:escape_shifted_capslock'

# start a terminal
bindsym $mod+Return exec alacritty

# start browser
bindsym $mod+b exec waterfox

# start TUI file manager
bindsym $mod+n exec $term ranger

# start gtt translate in floating
bindsym F2 exec $term_float gtt

# make a screenshot
bindsym Print exec --no-startup-id ~/.config/i3/scripts/make-screenshot-fullscreen.sh
bindsym Shift+Print exec --no-startup-id ~/.config/i3/scripts/make-screenshot-area.sh

# wallust screenshot update
bindsym F11 exec --no-startup-id ~/.config/i3/scripts/wallust-screenshot.sh
bindsym Shift+F11 exec --no-startup-id ~/.config/i3/scripts/wallust-screenshot-darkcomp.sh

# kill focused window
bindsym $mod+e kill

# start program launcher
bindsym $mod+d exec --no-startup-id rofi -show drun

# start clipmenu in rofi
bindsym $mod+c exec --no-startup-id env CM_LAUNCHER=rofi clipmenu

# change focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Control+$left move left
bindsym $mod+Control+$down move down
bindsym $mod+Control+$up move up
bindsym $mod+Control+$right move right

# move focused window
bindsym $mod+Control+Shift+$left move left 150px
bindsym $mod+Control+Shift+$down move down 150px
bindsym $mod+Control+Shift+$up move up 150px
bindsym $mod+Control+Shift+$right move right 150px

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# split in horizontal orientation
bindsym $mod+g split h

# split in vertical orientation
bindsym $mod+v split v

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s exec --no-startup-id bash -c '~/.config/i3/scripts/toggle-stacking.sh'
bindsym $mod+Tab exec --no-startup-id bash -c '~/.config/i3/scripts/toggle-tabbed.sh'
bindsym $mod+x layout toggle split

# toggle tiling / floating
bindsym $mod+Escape floating toggle

# change focus between tiling / floating windows
bindsym $mod+y focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent

# focus the child container
#bindsym $mod+d focus child

# move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+minus scratchpad show



# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart
# exit i3 (logs you out of your X session)
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Закрыть X11 и i3 WM' -B 'Да, перейти в LY' '$HOME/.config/i3/scripts/exit-i3.sh'"

# Перейти в режим Resize
bindsym $mod+r mode "resize"
# resize window (you can also use the mouse for that)
mode "resize" {
        # change window size on hjkl
        bindsym $Left        resize shrink width 50 px or 5 ppt
        bindsym $Down        resize grow height 50 px or 5 ppt
        bindsym $Up          resize shrink height 50 px or 5 ppt
        bindsym $Right       resize grow width 50 px or 5 ppt

        # Speed mode with Shift + hjkl
        bindsym Shift+$Left        resize shrink width 200 px or 15 ppt
        bindsym Shift+$Down        resize grow height 200 px or 15 ppt
        bindsym Shift+$Up          resize shrink height 200 px or 15 ppt
        bindsym Shift+$Right       resize grow width 200 px or 15 ppt

        # same bindings, but for the arrow keys
        bindsym Left        resize shrink width 50 px or 5 ppt
        bindsym Down        resize grow height 50 px or 5 ppt
        bindsym Up          resize shrink height 50 px or 5 ppt
        bindsym Right       resize grow width 50 px or 5 ppt

        # Speed mode with Shift + arrow keys
        bindsym Shift+Left        resize shrink width 200 px or 15 ppt
        bindsym Shift+Down        resize grow height 200 px or 15 ppt
        bindsym Shift+Up          resize shrink height 200 px or 15 ppt
        bindsym Shift+Right       resize grow width 200 px or 15 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}
